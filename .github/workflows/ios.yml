name: Build iOS IPA

on:
  push:
    branches: [main]
    paths: ['ios-menu-update/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      signing:
        description: Signing mode (signed requires Apple certificate and profile secrets)
        type: choice
        options: [unsigned, signed]
        default: unsigned
      build_number:
        description: Numeric build number
        default: '215345347'
        required: true
      native_test_only:
        description: Only run the native startup test (no new IPA)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || '215345347' }}
      SIGNING_MODE: unsigned
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply verified client 215345339 source update
        run: |
          echo "5026957ec0ef2f1bac2d58ccbecfdaf24bd57b96fb2d3e2db048bf6ec34ff9d7  ios-source-update-215345339.zip" | shasum -a 256 -c -
          unzip -oq ios-source-update-215345339.zip -d .
          cp ios-menu-update/LangLa_x.java ios-menu-update/ReleaseNotesDialog.java ios-menu-update/LangLa_mq.java ios-menu-update/LangLa_ij.java ios-menu-update/LangLa_ge.java src/beatdz/
          python3 -c 'from pathlib import Path; p = Path("src/beatdz/GameSrc.java"); p.write_text(p.read_text(encoding="utf-8"), encoding="utf-8")'
          python3 -c 'from pathlib import Path; paths = map(Path, ("src/beatdz/Char.java", "src/beatdz/LangLa_kl.java", "src/com/tgame/model/Caption.java")); [(p.write_text(p.read_text(encoding="utf-8"), encoding="utf-8")) for p in paths]'
          python3 -c 'from pathlib import Path; paths = map(Path, ("src/beatdz/Canvas.java", "src/beatdz/SettingsTab.java", "src/beatdz/mConfig.java", "ios/src/main/java/com/beatdz/langlalau/IOSLauncher.java", "ios/Info.plist.xml")); [p.write_text(p.read_text(encoding="utf-8"), encoding="utf-8") for p in paths]'
          git apply ios-menu-update/fps.patch ios-menu-update/hide-tanto.patch
          cp ios-menu-update/FrameRate.java src/beatdz/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/beatdz/FrameRate.java')
          s = p.read_text(encoding='utf-8')
          assert 'import java.util.function.IntConsumer;' in s
          s = s.replace('import java.util.function.IntConsumer;\n\n', '')
          s = s.replace('public final class FrameRate {', 'public final class FrameRate {\n    @FunctionalInterface\n    public interface Listener {\n        void apply(int fps);\n    }\n')
          p.write_text(s.replace('IntConsumer', 'Listener').replace('platform.accept(fps)', 'platform.apply(fps)'), encoding='utf-8')
          PY
          python3 -c 'from pathlib import Path; p = Path("src/beatdz/Canvas.java"); s = p.read_text(); old = "this.logicAccumulator += Math.min(var1, 0.1F);"; assert s.count(old) == 1; p.write_text(s.replace(old, "this.logicAccumulator += Math.min(var1, 0.1F) * (FrameRate.target() / 60f);").replace("float logicInterval = 1.0F / 30.0F;", "float logicInterval = RenderMotion.STEP;").replace("// Gameplay stays at 30 Hz regardless of the selected presentation rate.", "// Scale client simulation by the selected mode, independently of dropped frames."))'
          cp ios-menu-update/LangLa_av.java src/beatdz/
          cp ios-menu-update/IOSStartupSmoke.java ios/src/smoke/java/com/beatdz/langlalau/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare simulator build
        run: |
          chmod +x gradlew
          python3 tools/ci/prepare-ios.py
      - name: Native iOS cold-start to login
        run: |
          python3 -c 'from pathlib import Path; p = Path("tools/ci/ios-simulator-smoke.py"); s = p.read_text(); old = "deadline = time.monotonic() + 360"; assert s.count(old) == 1; p.write_text(s.replace(old, "deadline = time.monotonic() + 1200"))'
          python3 tools/ci/ios-simulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-native-startup-log-${{ inputs.build_number || '215345347' }}
          path: ios-native-smoke.log
          if-no-files-found: warn
  ipa:
    if: ${{ !inputs.native_test_only && !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || '215345347' }}
      SIGNING_MODE: ${{ inputs.signing || 'unsigned' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply verified client 215345339 source update
        run: |
          echo "5026957ec0ef2f1bac2d58ccbecfdaf24bd57b96fb2d3e2db048bf6ec34ff9d7  ios-source-update-215345339.zip" | shasum -a 256 -c -
          unzip -oq ios-source-update-215345339.zip -d .
          cp ios-menu-update/LangLa_x.java ios-menu-update/ReleaseNotesDialog.java ios-menu-update/LangLa_mq.java ios-menu-update/LangLa_ij.java ios-menu-update/LangLa_ge.java src/beatdz/
          python3 -c 'from pathlib import Path; p = Path("src/beatdz/GameSrc.java"); p.write_text(p.read_text(encoding="utf-8"), encoding="utf-8")'
          python3 -c 'from pathlib import Path; paths = map(Path, ("src/beatdz/Char.java", "src/beatdz/LangLa_kl.java", "src/com/tgame/model/Caption.java")); [(p.write_text(p.read_text(encoding="utf-8"), encoding="utf-8")) for p in paths]'
          python3 -c 'from pathlib import Path; paths = map(Path, ("src/beatdz/Canvas.java", "src/beatdz/SettingsTab.java", "src/beatdz/mConfig.java", "ios/src/main/java/com/beatdz/langlalau/IOSLauncher.java", "ios/Info.plist.xml")); [p.write_text(p.read_text(encoding="utf-8"), encoding="utf-8") for p in paths]'
          git apply ios-menu-update/fps.patch ios-menu-update/hide-tanto.patch
          cp ios-menu-update/FrameRate.java src/beatdz/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/beatdz/FrameRate.java')
          s = p.read_text(encoding='utf-8')
          assert 'import java.util.function.IntConsumer;' in s
          s = s.replace('import java.util.function.IntConsumer;\n\n', '')
          s = s.replace('public final class FrameRate {', 'public final class FrameRate {\n    @FunctionalInterface\n    public interface Listener {\n        void apply(int fps);\n    }\n')
          p.write_text(s.replace('IntConsumer', 'Listener').replace('platform.accept(fps)', 'platform.apply(fps)'), encoding='utf-8')
          PY
          python3 -c 'from pathlib import Path; p = Path("src/beatdz/Canvas.java"); s = p.read_text(); old = "this.logicAccumulator += Math.min(var1, 0.1F);"; assert s.count(old) == 1; p.write_text(s.replace(old, "this.logicAccumulator += Math.min(var1, 0.1F) * (FrameRate.target() / 60f);").replace("float logicInterval = 1.0F / 30.0F;", "float logicInterval = RenderMotion.STEP;").replace("// Gameplay stays at 30 Hz regardless of the selected presentation rate.", "// Scale client simulation by the selected mode, independently of dropped frames."))'
          cp ios-menu-update/LangLa_av.java src/beatdz/
          cp ios-menu-update/IOSStartupSmoke.java ios/src/smoke/java/com/beatdz/langlalau/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare build
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          chmod +x gradlew
          python3 tools/ci/prepare-ios.py
      - name: Import Apple signing files
        if: inputs.signing == 'signed'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 tools/ci/import-signing.py
      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          args=(-Pios "-PreleaseBuild=$BUILD_NUMBER")
          if [[ "$SIGNING_MODE" == signed ]]; then
            args+=(-Probovm.iosSkipSigning=false "-Probovm.iosSignIdentity=$IOS_SIGN_IDENTITY" "-Probovm.iosProvisioningProfile=$IOS_PROFILE_UUID")
          else
            args+=(-Probovm.iosSkipSigning=true)
          fi
          ./gradlew "${args[@]}" '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' :ios:createIPA --max-workers=2 --no-daemon --stacktrace
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LangLa-iOS-${{ inputs.build_number || '215345347' }}-${{ inputs.signing || 'unsigned' }}
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing files
        if: always() && inputs.signing == 'signed'
        run: python3 tools/ci/import-signing.py --cleanup
