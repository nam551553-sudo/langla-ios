name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: Signing mode (signed requires Apple certificate and profile secrets)
        type: choice
        options: [unsigned, signed]
        default: unsigned
      build_number:
        description: Numeric build number
        default: '215345362'
        required: true
      native_test_only:
        description: Only run the native startup test (no new IPA)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  hd-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ios-hd-assets
          path: ios/bootstrap/data/ios-hd/
          run-id: 43008756259
          github-token: ${{ github.token }}
      - name: Verify reused HD archives
        working-directory: ios/bootstrap/data/ios-hd
        run: |
          echo '3dba78831aaec114912d7cddc601c111bc4874b137fdaabc6650ac1addac0015  zoom3/iconClient.zip' | sha256sum -c
          echo '696edf3c0ba4f34e8b17a3a83a78a0663c0dc038fc9b670b1915f835e4bed6a3  zoom4/iconClient.zip' | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: ios-hd-assets
          path: ios/bootstrap/data/ios-hd/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  native-smoke:
    needs: hd-assets
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || '215345362' }}
      SIGNING_MODE: unsigned
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ios-hd-assets
          path: ios/bootstrap/data/ios-hd/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare simulator build
        run: |
          chmod +x gradlew
          python3 tools/ci/prepare-ios.py
      - name: Native iOS cold-start to login
        run: |
          python3 -c 'from pathlib import Path; p = Path("tools/ci/ios-simulator-smoke.py"); s = p.read_text(); old = "deadline = time.monotonic() + 360"; assert s.count(old) == 1; p.write_text(s.replace(old, "deadline = time.monotonic() + 1800"))'
          python3 -c 'from pathlib import Path; p = Path("ios/src/smoke/java/com/beatdz/langlalau/IOSStartupSmoke.java"); s = p.read_text(); assert s.count("300000000000L") == 1; p.write_text(s.replace("300000000000L", "1680000000000L"))'
          python3 tools/ci/ios-simulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-native-startup-log-${{ inputs.build_number || '215345362' }}
          path: ios-native-smoke.log
          if-no-files-found: warn
  ipa:
    needs: hd-assets
    if: ${{ !inputs.native_test_only && !contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      BUILD_NUMBER: ${{ inputs.build_number || '215345362' }}
      SIGNING_MODE: ${{ inputs.signing || 'unsigned' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ios-hd-assets
          path: ios/bootstrap/data/ios-hd/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare build
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          chmod +x gradlew
          python3 tools/ci/prepare-ios.py
      - name: Import Apple signing files
        if: inputs.signing == 'signed'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: python3 tools/ci/import-signing.py
      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          args=(-Pios "-PreleaseBuild=$BUILD_NUMBER")
          if [[ "$SIGNING_MODE" == signed ]]; then
            args+=(-Probovm.iosSkipSigning=false "-Probovm.iosSignIdentity=$IOS_SIGN_IDENTITY" "-Probovm.iosProvisioningProfile=$IOS_PROFILE_UUID")
          else
            args+=(-Probovm.iosSkipSigning=true)
          fi
          ./gradlew "${args[@]}" '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' :ios:createIPA --max-workers=2 --no-daemon --stacktrace
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LangLa-iOS-${{ inputs.build_number || '215345362' }}-${{ inputs.signing || 'unsigned' }}
          path: ios/build/robovm/**/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing files
        if: always() && inputs.signing == 'signed'
        run: python3 tools/ci/import-signing.py --cleanup
