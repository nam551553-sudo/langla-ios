plugins { id 'application' }
application { mainClass = 'com.langla.launcher.Launcher' }
dependencies { implementation "com.badlogicgames.gdx:gdx:$gdxVersion" }
tasks.register('fatJar', Jar) {
    dependsOn ':desktop:fatJar'
    archiveFileName = 'LangLaTest.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass.get() }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from(project(':desktop').tasks.named('fatJar').flatMap { it.archiveFile }) { into 'bootstrap'; rename { 'game.jar' } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('pcInput', Sync) { dependsOn 'fatJar'; from tasks.fatJar; into layout.buildDirectory.dir('pc-input') }
tasks.register('packagePc', Exec) {
    dependsOn 'pcInput'
    def output = rootProject.file(providers.gradleProperty('pcOutput').getOrElse('release/ReferenceUpdate/PC'))
    doFirst { if (output.exists()) throw new GradleException("Output already exists: $output") }
    commandLine new File(System.getProperty('java.home'), 'bin/jpackage').absolutePath,
        '--type','app-image','--name','LangLaTest','--input',layout.buildDirectory.dir('pc-input').get().asFile.absolutePath,
        '--main-jar','LangLaTest.jar','--main-class',application.mainClass.get(),
        '--jlink-options','--strip-debug --no-man-pages --no-header-files',
        '--icon',rootProject.file('resource/icons/lang-la-test.ico').absolutePath,
        '--add-launcher','LangLaTest-Software='+project(':desktop').file('software-launcher.properties').absolutePath,
        '--dest',output.absolutePath
    doLast {
        def java = new File(output, 'LangLaTest/runtime/bin/java.exe')
        if (!java.isFile()) throw new GradleException('PC runtime is missing java.exe; cannot start the game process')
        exec { commandLine java.absolutePath, '-version' }
    }
}
